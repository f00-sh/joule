# https://pre-commit.com
# Install once: pipx install pre-commit   (or: uv tool install pre-commit)
# Per repo:     pre-commit install --hook-type pre-commit --hook-type commit-msg
# Manual run:   pre-commit run --all-files
#
# The git template pre-commit hook auto-runs this file when `pre-commit` is on PATH.

default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5120]
      - id: check-case-conflict
      - id: check-symlinks
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: destroyed-symlinks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict]

  # Language-specific hooks: uncomment or add when the project language is set.
