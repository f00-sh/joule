[package]
name = "joule"
description = "CLI for the joule distributed compute cluster"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "joule"
path = "src/main.rs"

[dependencies]
joule-proto = { workspace = true }
joule-cluster = { workspace = true }
joule-runtime = { workspace = true }
joule-ledger = { workspace = true }
joule-control = { workspace = true }
joule-client = { workspace = true }
joule-dht = { workspace = true }
joule-mesh = { workspace = true }
joule-net = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
libc = "0.2"
# Cross-platform graphical shell (normie primary UI): plots + controls.
eframe = { version = "0.31", default-features = true }
egui_plot = "0.31"
open = "5"
