# Build multi-platform joule binaries + **native GUI OS installers**.
# Trigger: push tag v*  or  workflow_dispatch (manual, dry-run without tag).
#
# CLI archives (always):
#   joule-VER-linux-ARCH.tar.gz
#   joule-VER-darwin-ARCH.tar.gz
#   joule-VER-windows-ARCH.zip
#
# Native installers:
#   joule-VER-windows-x86_64-setup.exe   (Inno Setup wizard)
#   joule-VER-darwin-ARCH.pkg            (macOS Installer)
#   joule-VER-darwin-ARCH.dmg            (drag joule.app → Applications)
#   joule-VER-darwin-ARCH-app.zip        (standalone .app)
#   joule-VER-linux-ARCH.deb             (dpkg + .desktop)
#
# Also: install.sh install.ps1 SHA256SUMS file_id.diz SOP/memo PDFs when present
#
# Installers live on GitHub Releases only. f00 never hosts model weights.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts without creating a GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_os: linux
            asset_arch: x86_64
            ext: tar.gz
            cross: false
            native: deb
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_os: linux
            asset_arch: aarch64
            ext: tar.gz
            cross: true
            native: deb
          - os: macos-14
            target: x86_64-apple-darwin
            asset_os: darwin
            asset_arch: x86_64
            ext: tar.gz
            cross: false
            native: macos
          - os: macos-14
            target: aarch64-apple-darwin
            asset_os: darwin
            asset_arch: aarch64
            ext: tar.gz
            cross: false
            native: macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_os: windows
            asset_arch: x86_64
            ext: zip
            cross: false
            native: inno

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross (linux aarch64)
        if: matrix.cross
        shell: bash
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
          else
            TAG="v0.0.0-dev.${GITHUB_SHA::7}"
            VER="0.0.0-dev.${GITHUB_SHA::7}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
          echo "asset=joule-${VER}-${{ matrix.asset_os }}-${{ matrix.asset_arch }}.${{ matrix.ext }}" >> "$GITHUB_OUTPUT"

      - name: Build release binary (native)
        if: ${{ !matrix.cross }}
        shell: bash
        run: cargo build --release -p joule --target ${{ matrix.target }}

      - name: Build release binary (cross)
        if: matrix.cross
        shell: bash
        run: cross build --release -p joule --target ${{ matrix.target }}

      - name: Package CLI archive (unix)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.ver }}"
          ASSET="${{ steps.ver.outputs.asset }}"
          STAGING="dist/${ASSET%.tar.gz}"
          mkdir -p "${STAGING}/man"
          BIN="target/${{ matrix.target }}/release/joule"
          test -x "${BIN}"
          cp "${BIN}" "${STAGING}/joule"
          chmod 755 "${STAGING}/joule"
          if [[ -f man/joule.1 ]]; then
            cp man/joule.1 "${STAGING}/man/"
          fi
          cp man/joule.1.md "${STAGING}/man/" 2>/dev/null || true
          cp README.md LICENSE CHANGELOG.md "${STAGING}/" 2>/dev/null || true
          printf '%s\n' "${VER}" > "${STAGING}/VERSION"
          tar -C dist -czf "dist/${ASSET}" "${ASSET%.tar.gz}"
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${ASSET}" > "${ASSET}.sha256"
            else
              shasum -a 256 "${ASSET}" > "${ASSET}.sha256"
            fi
          )
          ls -la dist/

      - name: Package CLI archive (windows zip)
        if: matrix.ext == 'zip'
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.ver }}"
          ASSET="${{ steps.ver.outputs.asset }}"
          STAGING="dist/${ASSET%.zip}"
          mkdir -p "${STAGING}/man"
          BIN="target/${{ matrix.target }}/release/joule.exe"
          test -f "${BIN}"
          cp "${BIN}" "${STAGING}/joule.exe"
          cp scripts/install.ps1 "${STAGING}/"
          cp packaging/windows/README.txt "${STAGING}/" 2>/dev/null || true
          cp man/joule.1.md "${STAGING}/man/" 2>/dev/null || true
          cp README.md LICENSE CHANGELOG.md "${STAGING}/" 2>/dev/null || true
          printf '%s\n' "${VER}" > "${STAGING}/VERSION"
          (cd dist && 7z a -tzip "${ASSET}" "${ASSET%.zip}/*")
          (cd dist && sha256sum "${ASSET}" > "${ASSET}.sha256" || shasum -a 256 "${ASSET}" > "${ASSET}.sha256")
          ls -la dist/

      - name: Native macOS installers (.app .pkg .dmg)
        if: matrix.native == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x packaging/macos/build-native.sh
          packaging/macos/build-native.sh \
            --bin "target/${{ matrix.target }}/release/joule" \
            --version "${{ steps.ver.outputs.ver }}" \
            --arch "${{ matrix.asset_arch }}" \
            --out dist
          ls -la dist/

      - name: Native Linux .deb
        if: matrix.native == 'deb'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev
          chmod +x packaging/linux/build-deb.sh
          packaging/linux/build-deb.sh \
            --bin "target/${{ matrix.target }}/release/joule" \
            --version "${{ steps.ver.outputs.ver }}" \
            --arch "${{ matrix.asset_arch }}" \
            --out dist
          ls -la dist/

      - name: Native Windows Setup.exe (Inno Setup)
        if: matrix.native == 'inno'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          powershell -File packaging/windows/build-native.ps1 `
            -Bin "target/${{ matrix.target }}/release/joule.exe" `
            -Version "${{ steps.ver.outputs.ver }}" `
            -Arch "${{ matrix.asset_arch }}" `
            -Out dist
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: joule-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: |
            dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten + checksums + install scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( \
            -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \
            -o -name '*.exe' -o -name '*.msi' -o -name '*.pkg' \
            -o -name '*.dmg' -o -name '*.deb' -o -name '*.app.zip' \
          \) -exec cp -v {} dist/ \;
          # catch *-app.zip named without leading *
          find artifacts -type f -name '*-app.zip' -exec cp -v {} dist/ \; || true
          find artifacts -type f -name '*-setup.exe' -exec cp -v {} dist/ \; || true
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1
          chmod 755 dist/install.sh
          if [[ -f file_id.diz ]]; then cp file_id.diz dist/; fi
          if [[ -f docs/sop-joule-ops.pdf ]]; then cp docs/sop-joule-ops.pdf dist/; fi
          if compgen -G 'docs/releases/v*-memo.pdf' > /dev/null; then
            cp docs/releases/v*-memo.pdf dist/ || true
          fi
          # Versionless stable names for permanent /latest and joule.f00.sh/current/* links
          VER="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          VER="${VER#v}"
          if [[ -z "$VER" ]]; then
            VER="$(ls dist/joule-*-linux-x86_64.tar.gz 2>/dev/null | head -1 | sed -n 's|.*/joule-\([0-9.]*\)-linux.*|\1|p')"
          fi
          chmod +x scripts/stable-release-aliases.sh
          VER="$VER" scripts/stable-release-aliases.sh dist
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.0.0-dev.{0}', github.sha) }}
          name: joule ${{ github.ref_type == 'tag' && github.ref_name || format('dev {0}', github.sha) }}
          draft: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
          body: |
            ## Permanent links (always newest)

            Site: https://joule.f00.sh/current/
            GitHub: `https://github.com/f00-sh/joule/releases/latest/download/<stable-name>`

            ### GUI installers
            | Platform | Permanent URL |
            |---|---|
            | Windows Setup | https://github.com/f00-sh/joule/releases/latest/download/joule-windows-x86_64-setup.exe |
            | macOS arm64 .pkg | https://github.com/f00-sh/joule/releases/latest/download/joule-darwin-aarch64.pkg |
            | macOS arm64 .dmg | https://github.com/f00-sh/joule/releases/latest/download/joule-darwin-aarch64.dmg |
            | macOS intel .pkg | https://github.com/f00-sh/joule/releases/latest/download/joule-darwin-x86_64.pkg |
            | Linux amd64 .deb | https://github.com/f00-sh/joule/releases/latest/download/joule-linux-x86_64.deb |
            | Linux arm64 .deb | https://github.com/f00-sh/joule/releases/latest/download/joule-linux-aarch64.deb |

            Site mirrors: `/current/windows/setup.exe`, `/current/macos/arm64.pkg`, `/current/linux/amd64.deb`, …

            ### CLI
            ```bash
            curl -fsSL https://joule.f00.sh/current/install.sh | sh
            # or: …/releases/latest/download/install.sh
            ```
            ```powershell
            irm https://joule.f00.sh/current/install.ps1 | iex
            ```

            Versioned assets (`joule-X.Y.Z-…`) still attach for checksums and packaging pins.

            After install: **joule** (GUI) or `joule version`.

            > Unsigned: SmartScreen / Gatekeeper may warn until Authenticode / notarization certs exist.

            Weights never on f00. Download UI: https://joule.f00.sh/download.html
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
