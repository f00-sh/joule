name: Deploy site (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "wrangler.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages-cloudflare-joule
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Sanity — landing page present
        run: |
          test -f docs/index.html
          grep -q 'pay in compute' docs/index.html
          grep -q 'millijoule' docs/index.html

      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Create is idempotent enough: ignore "already exists"
          command: pages project create f00-joule --production-branch=main
        continue-on-error: true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs --project-name=f00-joule --branch=main --commit-dirty=true

      - name: Attach joule.f00.sh + DNS CNAME
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ZONE_ID: 534b4bb36c9c76bd3216ab60fd878a3f
          DOMAIN: joule.f00.sh
          PROJECT: f00-joule
        run: |
          set -euo pipefail
          # Pages custom domain (idempotent-ish)
          code=$(curl -sS -o /tmp/pages-domain.json -w '%{http_code}' -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${PROJECT}/domains" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"${DOMAIN}\"}")
          echo "pages domain HTTP ${code}"
          cat /tmp/pages-domain.json
          # Accept 200/created or already exists
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/pages-domain.json"))
          if r.get("success"):
              print("domain ok", r.get("result",{}).get("name"))
          else:
              errs=str(r.get("errors"))
              if "already" in errs.lower() or "exists" in errs.lower() or "8000014" in errs:
                  print("domain already attached")
              else:
                  # 400 with specific code still may mean attached — log and continue for DNS
                  print("domain attach note:", errs)
          PY
          # Upsert CNAME joule -> f00-joule.pages.dev (proxied)
          list=$(curl -sS "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?type=CNAME&name=${DOMAIN}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}")
          rid=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d["result"][0]["id"] if d.get("result") else "")' "$list")
          body='{"type":"CNAME","name":"joule","content":"f00-joule.pages.dev","ttl":1,"proxied":true}'
          if [ -n "$rid" ]; then
            curl -sS -X PUT "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${rid}" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$body" | tee /tmp/dns.json
          else
            curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$body" | tee /tmp/dns.json
          fi
          python3 -c 'import json; r=json.load(open("/tmp/dns.json")); assert r.get("success"), r; print("dns", r["result"]["name"], "->", r["result"]["content"])'
