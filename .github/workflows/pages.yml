name: Deploy site (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "functions/**"
      - "wrangler.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages-cloudflare-joule
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Sanity — site + functions
        run: |
          test -f docs/index.html
          test -f docs/styles.css
          test -f docs/app.js
          test -f functions/api/pool.js
          test -f functions/api/pool/stream.js
          test -f functions/api/ingest.js
          grep -q 'f00-theme.css' docs/index.html
          grep -q 'brand-mark' docs/index.html
          grep -q '/api/pool' docs/app.js

      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create f00-joule --production-branch=main
        continue-on-error: true

      # wrangler.toml pages_build_output_dir=docs + functions/ + KV binding
      - name: Deploy site + Functions
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs --project-name=f00-joule --branch=main --commit-dirty=true

      - name: Attach joule.f00.sh custom domain
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ZONE_ID: 534b4bb36c9c76bd3216ab60fd878a3f
          DOMAIN: joule.f00.sh
          PROJECT: f00-joule
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages-domain.json -w '%{http_code}' -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${PROJECT}/domains" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"${DOMAIN}\"}")
          echo "pages domain HTTP ${code}"
          cat /tmp/pages-domain.json
          python3 - <<'PY'
          import json, sys
          r=json.load(open("/tmp/pages-domain.json"))
          if r.get("success"):
              print("domain ok", r.get("result",{}).get("name"), r.get("result",{}).get("status"))
              sys.exit(0)
          errs=str(r.get("errors"))
          if any(x in errs.lower() for x in ("already", "exist", "8000007", "8000014")):
              print("domain already attached")
              sys.exit(0)
          print("domain attach note:", errs)
          sys.exit(0)
          PY
          # Best-effort CNAME (MCP/connector often already owns DNS)
          set +e
          body='{"type":"CNAME","name":"joule","content":"f00-joule.pages.dev","ttl":1,"proxied":true}'
          list=$(curl -sS "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?type=CNAME&name=${DOMAIN}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}")
          rid=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d["result"][0]["id"] if d.get("success") and d.get("result") else "")' "$list" 2>/dev/null || true)
          if [ -n "${rid:-}" ]; then
            curl -sS -X PUT "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${rid}" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" --data "$body" | tee /tmp/dns.json
          else
            curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" --data "$body" | tee /tmp/dns.json
          fi
          python3 - <<'PY'
          import json
          try:
              r=json.load(open("/tmp/dns.json"))
          except Exception as e:
              print("dns skip", e); raise SystemExit(0)
          print("dns", r.get("success"), r.get("errors") or r.get("result",{}).get("name"))
          PY
